
services:
  # 1. Frontend Development Container
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    container_name: pk_frontend_dev
    restart: always
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_APP_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:5000/api
      INTERNAL_API_URL: http://backend:5000
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules
      - /app/frontend/.next
    networks:
      - shared-net
      - lms-net
    depends_on:
      - backend

  # 2. Backend Development Container (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: pk_backend_dev
    restart: always
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TRANSCODER_SHARED_SECRET: ${TRANSCODER_SHARED_SECRET:-development-transcoder-secret-change-me}
      CORS_ORIGINS: http://localhost:3001
      PUBLIC_APP_URL: http://localhost:3001
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules
    networks:
      - lms-net
    depends_on:
      - postgres
      - redis
      - minio
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # 3. FFmpeg Video Transcoder Worker Development Container
  transcoder_worker:
    build:
      context: .
      dockerfile: workers/transcoder/Dockerfile.dev
    container_name: pk_transcoder_dev
    restart: always
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TRANSCODER_SHARED_SECRET: ${TRANSCODER_SHARED_SECRET:-development-transcoder-secret-change-me}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/workers/transcoder/node_modules
    networks:
      - lms-net
    depends_on:
      - redis
      - minio

  # 4. PostgreSQL Relational Database (Port exposed for host connection)
  postgres:
    image: postgres:16-alpine
    container_name: pk_postgres_dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - lms-net

  # 5. Redis Cache & Broker (Port exposed for host connection)
  redis:
    image: redis:7-alpine
    container_name: pk_redis_dev
    restart: always
    volumes:
      - redis_data_dev:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - lms-net

  # 6. Object Storage Service (MinIO - Ports exposed for direct Console and API access)
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: pk_minio_dev
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_dev:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - lms-net

networks:
  # Internal network isolated for LMS services
  lms-net:
    driver: bridge
    name: pk_lms_net_dev

  # External network shared with the host reverse proxy
  shared-net:
    external: true
    name: shared-net

volumes:
  postgres_data_dev:
  redis_data_dev:
  minio_data_dev:
