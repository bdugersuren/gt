

services:
  # 1. Frontend Application (Next.js SSR + PWA)
  # Connected to both shared-net (for host proxy) and lms-net (for internal APIs)
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: pk_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_APP_URL: https://gurvantamir.know.mn
      NEXT_PUBLIC_API_URL: https://gurvantamir.know.mn/api
      INTERNAL_API_URL: http://backend:5000
    ports:
      - "3001:3000"
    networks:
      - shared-net
      - lms-net
    depends_on:
      - backend

  # 2. Backend API Service (Node.js/NestJS + Prisma)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: pk_backend
    restart: always
    depends_on:
      - postgres
      - redis
      - minio
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      PUBLIC_APP_URL: https://gurvantamir.know.mn
    expose:
      - "5000"
    networks:
      - lms-net

  # 3. FFmpeg Video Transcoder Worker (BullMQ Consumer)
  transcoder_worker:
    build:
      context: .
      dockerfile: workers/transcoder/Dockerfile
    container_name: pk_transcoder
    restart: always
    depends_on:
      - redis
      - minio
    environment:
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    networks:
      - lms-net

  # 4. Relational Database (Isolated internal network)
  postgres:
    image: postgres:16-alpine
    container_name: pk_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - lms-net

  # 5. Redis Cache & Job Broker (Isolated internal network)
  redis:
    image: redis:7-alpine
    container_name: pk_redis
    restart: always
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - lms-net

  # 6. Object Storage Service (MinIO S3 - Isolated internal network)
  minio:
    image: minio/minio:RELEASE.2024-01-28T22-35-53Z
    container_name: pk_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    expose:
      - "9000"
      - "9001"
    networks:
      - lms-net

networks:
  # Internal network isolated for LMS micro-services and DB
  lms-net:
    driver: bridge
    name: pk_lms_net

  # External network shared with the host reverse proxy (Nginx / Traefik)
  shared-net:
    external: true
    name: shared-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
